id = "jmarbutt.spaces-pr-status"
name = "Spaces PR Status"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Show GitHub pull request status on herdr spaces, with a Conductor-style PR board"
platforms = ["linux", "macos"]

# Repopulate tokens after a server start or live handoff, and make sure the
# poller is running. Token metadata is not restored across restarts, so this is
# what puts PR status back in the sidebar.
[[startup]]
command = ["node", "bin/startup.js"]

# Self-heal: if the poller died, a new worktree brings it back without waiting
# for a server restart.
[[events]]
on = "worktree.created"
command = ["node", "bin/startup.js"]

[[actions]]
id = "refresh"
title = "Refresh PR status"
description = "Re-query GitHub for every space, ignoring caches"
contexts = ["workspace", "tab", "pane"]
command = ["node", "bin/refresh.js"]

[[actions]]
id = "open"
title = "Open pull request"
description = "Open the focused space's pull request in the browser"
contexts = ["workspace", "tab", "pane"]
command = ["node", "bin/open-pr.js"]

[[actions]]
id = "board"
title = "Pull request board"
description = "Show every space grouped by pull request state"
contexts = ["workspace", "tab", "pane"]
command = ["node", "bin/board-open.js"]

[[actions]]
id = "checks"
title = "This space's checks"
description = "Show the focused space's pull request checks in a side panel or tab"
contexts = ["workspace", "tab", "pane"]
command = ["node", "bin/checks-open.js"]

[[panes]]
id = "board"
title = "Pull requests"
placement = "popup"
width = "70%"
height = "70%"
command = ["node", "bin/board.js"]

# Opened as a split this is a desktop side panel; as a tab it is what herdr's
# single-column mobile layout wants. The action picks via checksPlacement.
# No width/height here: herdr only accepts those for popup placement.
[[panes]]
id = "checks"
title = "Checks"
placement = "split"
command = ["node", "bin/checks.js"]

# No [[link_handlers]] on purpose. Intercepting a clicked PR URL to show the
# board would be worse than herdr's default of just opening the PR.
